services:
  easy-rss:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - '3000'
    environment:
      - SERVICE_FQDN_EASYRSS_3000
      - 'NODE_ENV=production'
      - 'PORT=3000'
      - 'DATA_DIR=/app/data'
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    volumes:
      - 'easy-rss-data:/app/data'
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
volumes:
  easy-rss-data:
